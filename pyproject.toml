[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gammu-sms-tui"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
gammu-sms-tui = "sms_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
